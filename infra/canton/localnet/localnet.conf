# Groundwork LocalNet: one synchronizer, two independently authenticated participants.
# The JWT secrets below are LOCAL DEVELOPMENT values only (localnet.env); DevNet/TestNet use OIDC.
canton {
  parameters.non-standard-config = yes
  features.enable-preview-commands = yes

  sequencers.sequencer1 {
    storage.type = memory
    public-api { address = "0.0.0.0", port = 5001 }
    admin-api { address = "0.0.0.0", port = 5002 }
    sequencer { type = reference, config.storage.type = memory }
  }
  mediators.mediator1 {
    storage.type = memory
    admin-api { address = "0.0.0.0", port = 5202 }
  }

  participants.legalaid {
    storage.type = memory
    admin-api { address = "127.0.0.1", port = 5012 }   # admin API never leaves the container
    ledger-api {
      address = "0.0.0.0"
      port = 5011
      auth-services = [{ type = unsafe-jwt-hmac-256, secret = ${LEGALAID_JWT_SECRET} }]
      admin-token-config { fixed-admin-token = ${LEGALAID_ADMIN_TOKEN}, admin-claim = true, act-as-any-party-claim = false }   # console only; never given to Groundwork
    }
    http-ledger-api.server { address = "0.0.0.0", port = 7011 }
  }

  participants.registry {
    storage.type = memory
    admin-api { address = "127.0.0.1", port = 5022 }
    ledger-api {
      address = "0.0.0.0"
      port = 5021
      auth-services = [{ type = unsafe-jwt-hmac-256, secret = ${REGISTRY_JWT_SECRET} }]
      admin-token-config { fixed-admin-token = ${REGISTRY_ADMIN_TOKEN}, admin-claim = true, act-as-any-party-claim = false }   # console only; never given to Groundwork
    }
    http-ledger-api.server { address = "0.0.0.0", port = 7021 }
  }
}
