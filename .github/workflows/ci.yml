# Verification only — no cloud credentials, runs on every push and pull request.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: groundwork_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pip install -q -e '.[dev,postgres,gcp]' pip-audit
      - run: ruff check app tests
      - name: tests (SQLite)
        run: python -m pytest -q
      - name: tests (PostgreSQL 16)
        run: python -m pytest -q
        env: { GROUNDWORK_TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/groundwork_test" }
      # Audit the exact installed third-party set. The project itself is not on PyPI, so it is
      # excluded (editable install); --strict still fails on any dependency that can't be audited.
      - name: dependency audit
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/locked.txt"
          pip-audit --strict --progress-spinner off --no-deps --disable-pip -r "$RUNNER_TEMP/locked.txt"
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: build the production image (not pushed)
        run: docker build -t groundwork:ci .
      - name: container starts and answers /health as non-root
        run: |
          docker run -d --name gw -e ENVIRONMENT=development -p 8080:8080 groundwork:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 1; done
          test "$(docker exec gw id -u)" = "10001"
          docker rm -f gw
